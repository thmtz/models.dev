# Reasoning is effort-only: the live catalog reports supported_efforts
# ["none","low","high","max"], and reasoning_effort = none disables thinking,
# so no separate toggle is declared (effort-includes-none rule). max produces
# deep reasoning while low/high produce minimal reasoning; matches the
# first-party moonshotai baseline.
# thinking_token_budget is documented but rejected by the current vLLM V2
# runner ("not yet supported by the V2 model runner"), so it is not declared.
# Sources:
# https://portal.neuralwatt.com/docs/api/chat-completions
# https://platform.kimi.ai/docs/guide/use-reasoning-effort
base_model = "moonshotai/kimi-k3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3

[limit]
context = 1_048_560
output = 1_048_560

[modalities]
input = ["text", "image"]
