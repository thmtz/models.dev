# Reasoning is off by default and controlled by reasoning_effort alone;
# "none" disables thinking (aliases: xhigh->max, medium->high, low->high,
# minimal->high).
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 0.14
output = 0.28
cache_read = 0.028

[limit]
context = 1_048_560
output = 65_536
