# Flex tier: async/queued processing at a 0.65 pricing multiplier (35% off) vs kimi-k3.
# Requires stream = true (non-streaming requests fall through to standard tier).
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Flex"

[[reasoning_options]]
type = "toggle" # API: {"chat_template_kwargs": {"enable_thinking": false}}

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.95
output = 9.75
cache_read = 0.195

[limit]
context = 1_048_560
output = 1_048_560

[modalities]
input = ["text", "image"]
output = ["text"]
