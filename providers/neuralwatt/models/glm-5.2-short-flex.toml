# Reasoning is controlled by reasoning_effort alone; "none" disables thinking.
# The API accepts the full seven-level scale but aliases it down to three real
# levels: xhigh->max, medium->high, low->high, minimal->none.
# Flex tier of the 200K short pool: async/queued processing at a 0.65 pricing
# multiplier (35% off) vs glm-5.2-short. Requires stream = true (non-streaming
# requests fall through to the standard tier).
# Host deltas vs the lab model: no structured output (json_mode = false on the
# live catalog), 200K context with a 32K output cap.
base_model = "zhipuai/glm-5.2"
name = "GLM-5.2 (short, flex)"
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 0.9425
output = 2.925
cache_read = 0.09425

[limit]
context = 199_984
output = 32_000
